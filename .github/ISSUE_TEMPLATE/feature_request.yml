name: 功能建议
description: 说明使用场景和可验收的行为。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先查看 docs/development/roadmap.md。已规划的功能可补充具体使用场景，无需将计划状态写成缺陷。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明目前哪个操作受阻，以及对用户的影响。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望行为
      description: 给出合成输入和可观察结果；不需要预先指定实现库。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的做法与边界
      description: 可选。说明相关计划 ID、替代操作或兼容性要求。
